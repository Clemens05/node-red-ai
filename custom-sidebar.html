<script type="text/javascript">
  var content;
  var chatHistory = [];

  function getCurrentFlows() {
    return RED.nodes.createCompleteNodeSet();
  }
  function applyFlowChanges(newFlows) {
    if (newFlows) {
      RED.nodes.version(null);
      RED.nodes.clear();
      RED.nodes.import(newFlows);
      RED.nodes.dirty(true);
      RED.view.redraw(true);
      RED.notify("Flows wurden von der KI aktualisiert", "success");
    }
  }

  function init() {
    content = $("<div>", { class: "red-ui-sidebar-ai-chat-content" });
    var chatContainer = $("<div>", {
      class: "red-ui-sidebar-ai-chat-messages",
    }).appendTo(content);
    var inputContainer = $("<div>", {
      class: "red-ui-sidebar-ai-chat-input",
    }).appendTo(content);

    var textarea = $("<textarea>", {
      class: "red-ui-sidebar-ai-chat-input-text",
      id: "node-input-ai-chat",
      placeholder: "Ask the AI assistant about your flows...",
    }).appendTo(inputContainer);

    var buttonContainer = $("<div>", {
      class: "red-ui-sidebar-ai-chat-buttons",
    }).appendTo(inputContainer);

    var sendButton = $("<button>", {
      class: "red-ui-button",
      text: "Send",
    }).appendTo(buttonContainer);
    var clearButton = $("<button>", {
      class: "red-ui-button red-ui-button-small",
      text: "Clear Chat",
    }).appendTo(buttonContainer);

    // Handle Enter key
    textarea.on("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendButton.on("click", sendMessage);
    clearButton.on("click", clearChat);

    function sendMessage() {
      var message = textarea.val().trim();

      if (message) {
        addMessage("user", message);
        textarea.val("").trigger("change");
        textarea.prop("disabled", true);
        sendButton.prop("disabled", true);

        // Sende Nachricht mit aktuellen Flows
        $.ajax({
          url: "chat",
          method: "POST",
          contentType: "application/json",
          data: JSON.stringify({
            message: message,
            flows: getCurrentFlows(),
            history: chatHistory,
          }),
          success: function (response) {
            console.log("response", response.response);
            addMessage("assistant", response.response.message);
            if (response.response.flows) {
              applyFlowChanges(response.response.flows);
            }
          },
          error: function (err) {
            let errorMessage =
              "Error: Could not get response from AI assistant";
            if (err.responseJSON?.error) {
              errorMessage += "\n" + err.responseJSON.error;
            }
            addMessage("system", errorMessage);
            console.error("AI Chat Error:", err);
          },
          complete: function () {
            textarea.prop("disabled", false);
            sendButton.prop("disabled", false);
            textarea.focus();
          },
        });
      }
    }
    function clearChat() {
      chatHistory = [];
      chatContainer.empty();
    }

    RED.sidebar.addTab({
      id: "ai-chat",
      label: "AI Chat",
      name: "AI Chat",
      iconClass: "fa fa-comments",
      content: content,
    });
  }

  function addMessage(sender, text) {
    var messageDiv = $("<div>", {
      class:
        "red-ui-sidebar-ai-chat-message " +
        (sender === "user"
          ? "user-message"
          : sender === "system"
          ? "system-message"
          : "ai-message"),
    });
    var formattedText = text;
    try {
      formattedText = formattedText.replace(/```(\w*)\n([\s\S]*?)```/g, "");
    } catch (e) {
      console.log("Failed to remove code blocks from the message:", e);
    }
    console.log("formattedText", formattedText);
    messageDiv.html(formattedText);

    chatHistory.push({ sender: sender, text: text });
    $(".red-ui-sidebar-ai-chat-messages")
      .append(messageDiv)
      .scrollTop(function () {
        return this.scrollHeight;
      });
  }

  RED.plugins.registerPlugin("node-red-ai", {
    type: "node-red-ai",
    onadd: function () {
      init();

      RED.events.on("sidebar:custom-sidebar", function (done) {
        // Create the sidebar content container if it doesn't exist

        if (done) done();
      });
    },
  });
</script>
